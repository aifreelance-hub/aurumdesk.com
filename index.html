<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE DOLL | Professional Hyper-Realistic Artistry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.paypal.com/sdk/js?client-id=BAAUEoAINS_-q3fOEaBBCBj0tkbRjlctYRcClEOsvbxzhuU_g0CEi9sBQcqfCYK_Me-exptsAZQhNuKuOo&components=hosted-buttons&disable-funding=venmo&currency=USD&locale=en_US"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@200;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; scroll-behavior: smooth; }
        .serif { font-family: 'Playfair Display', serif; }
        .float-btn { transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .float-btn:hover { transform: translateY(-3px); background: white; color: black; }
        
        /* 隐藏 PayPal 自动生成的描述文本，只保留按钮 */
        .paypal-button-container-only button { margin-top: 0 !important; }
    </style>
</head>
<body>

    <nav class="fixed w-full z-50 flex justify-between items-center px-6 md:px-10 py-6 md:py-8 bg-black/60 backdrop-blur-md border-b border-white/5">
        <div class="text-xl md:text-2xl font-bold tracking-tighter serif uppercase">Luxe Doll</div>
        <div class="flex space-x-4 md:space-x-8 text-[8px] md:text-[9px] tracking-[0.2em] uppercase font-semibold">
            <a href="#factory" class="hover:text-gray-400">Heritage</a>
            <a href="#collection" class="hover:text-gray-400">Collection</a>
            <a href="#policy" class="hover:text-gray-400">Policy</a>
        </div>
    </nav>

    <section class="h-[60vh] relative flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-zinc-900"></div>
        <div class="relative z-10 text-center px-6">
            <h1 class="serif text-5xl md:text-7xl italic mb-4">The Art of Realism</h1>
            <p class="tracking-[0.4em] uppercase text-[10px] text-gray-400">Professional Grade • Discrete Shipping</p>
        </div>
    </section>

    <section id="collection" class="py-24 px-6 md:px-24 bg-white text-black">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-y-16 gap-x-8"></div>
    </section>

    <section id="policy" class="py-24 px-10 bg-black text-center">
        <h2 class="serif text-3xl mb-8 italic">Shipping & Terms</h2>
        <p class="text-gray-500 text-xs tracking-widest uppercase">No Returns on Private Assets • Discrete Packaging Guaranteed</p>
    </section>

    <div class="fixed bottom-8 right-8 z-[100] flex flex-col space-y-3">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="float-btn w-10 h-10 bg-black border border-white/20 rounded-full flex items-center justify-center text-white text-sm">↑</button>
        <button onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})" class="float-btn w-10 h-10 bg-black border border-white/20 rounded-full flex items-center justify-center text-white text-[9px]">DOC</button>
    </div>

    <script>
        const grid = document.getElementById('product-grid');
        
        for (let i = 1; i <= 31; i++) {
            let num = i < 10 ? '0' + i : i;
            let price = (i === 1) ? 280 : (1800 + (i * 25)); 
            
            grid.innerHTML += `
                <div class="flex flex-col">
                    <div class="aspect-[3/4] bg-zinc-100 mb-4 overflow-hidden">
                        <img src="images/product-${num}.jpg" onerror="this.src='https://via.placeholder.com/300x400'" class="w-full h-full object-cover">
                    </div>
                    <div class="flex flex-col space-y-2">
                        <h3 class="serif text-lg italic">Luxe ${num}</h3>
                        <p class="font-bold text-xl mb-4">$${price}</p>
                        <div id="paypal-btn-${num}" class="paypal-button-container-only"></div>
                    </div>
                </div>
            `;
        }

        function initPayPal() {
            if (!window.paypal) return;

            // 第一个产品：使用 Hosted Button，但配置为只显示按钮
            paypal.HostedButtons({
                hostedButtonId: "KJGFNAY5VBR8N",
            }).render("#paypal-btn-1");

            // 其余产品：使用标准按钮
            for (let i = 2; i <= 31; i++) {
                let num = i < 10 ? '0' + i : i;
                let price = 1800 + (i * 25);
                paypal.Buttons({
                    style: { layout: 'horizontal', color: 'black', shape: 'rect', label: 'pay', height: 35 },
                    createOrder: (data, actions) => {
                        return actions.order.create({
                            purchase_units: [{ amount: { value: price.toString() } }]
                        });
                    }
                }).render(`#paypal-btn-${i}`);
            }
        }

        window.onload = () => { setTimeout(initPayPal, 500); };
    </script>
</body>
</html>
